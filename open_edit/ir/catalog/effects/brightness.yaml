name: brightness
mlt_service: brightness
target_kind: [clip]
params:
  value:
    type: float
    default: 1.0
    range: [0.0, 2.0]
    property: level
    description: "Brightness multiplier. 1.0 is unchanged; <1.0 darkens, >1.0 brightens (MLT volume/brightness 'level' semantics)."
keyframe_params: [value]
interp: [linear, discrete]
description: "Brightness adjustment via MLT brightness filter (property 'level'). value=1.0 is unchanged."
