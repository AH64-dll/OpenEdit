name: Release packages

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and verify ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2025
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
      OPEN_EDIT_CHROMIUM_NO_SANDBOX: "1"
      OPEN_EDIT_RENDER_BACKEND: cpu
      OPEN_EDIT_RENDER_TIMEOUT_S: "120"
      OPEN_EDIT_DEBUG_RENDER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build==1.5.0
          python -m build
      - name: Check tag and package version agree
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              assert ref == 'refs/tags/v' + version, (ref, version)
      - name: Create download archive and checksum
        run: python scripts/package_release.py --platform ${{ matrix.platform }}
      - name: Extract download, including a path with spaces
        shell: python
        run: |
          import os, zipfile
          from pathlib import Path
          archive = next(Path('dist/release').glob('*.zip'))
          target = Path(os.environ['RUNNER_TEMP']) / 'OpenEdit download'
          with zipfile.ZipFile(archive) as source:
              assert source.testzip() is None
              source.extractall(target)
          root = next(target.iterdir())
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('DOWNLOAD_ROOT=' + str(root) + '\n')
              env.write('INSTALL_ROOT=' + str(Path(os.environ['RUNNER_TEMP']) / 'OpenEdit installed') + '\n')
      - name: Verify PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [Management.Automation.Language.Parser]::ParseFile("$env:DOWNLOAD_ROOT\install.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - name: Install and verify actual downloaded Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          bash "$DOWNLOAD_ROOT/install.sh" --dir "$INSTALL_ROOT" --no-project 2>&1 | tee "$RUNNER_TEMP/install-full.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            python -c "import os; from pathlib import Path; text=Path(os.environ['RUNNER_TEMP']).joinpath('install-full.log').read_text()[-3000:]; print('::error::'+text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))"
          fi
          exit "$result"
      - name: Install and verify actual downloaded Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            & "$env:DOWNLOAD_ROOT\install.ps1" -InstallDir "$env:INSTALL_ROOT" -NoProject *>&1 | Tee-Object "$env:RUNNER_TEMP\install-full.log" | ForEach-Object {
              Write-Host $_
              if ("$_" -match '^Verify:') { Write-Host "::notice::$_" }
            }
          } catch {
            $tail = (Get-Content "$env:RUNNER_TEMP\install-full.log" -Tail 25) -join "`n"
            Write-Host ('::error::' + $tail.Replace('%','%25').Replace("`n",'%0A').Replace("`r",'%0D'))
            throw
          }
      - name: Check fresh installed-wheel dependencies and capabilities
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          prefix = Path(os.environ['INSTALL_ROOT'])
          python = prefix / ('.venv/Scripts/python.exe' if os.name == 'nt' else '.venv/bin/python')
          subprocess.run([str(python), '-I', '-m', 'pip', 'check'], check=True)
          result = subprocess.run([str(python), '-I', '-m', 'open_edit.cli', 'doctor', '--json'], capture_output=True, text=True, check=True)
          capabilities = json.loads(result.stdout)['capabilities']
          assert all(capabilities[name] for name in ('timeline', 'media', 'graphics', 'audio_eq')), capabilities
          report = json.loads((prefix / 'install-report.json').read_text())
          assert report['passed'] and report['animated_overlay_pixels_verified'] and report['ui_export_verified']
      - uses: actions/upload-artifact@v4
        with:
          name: openedit-${{ matrix.platform }}
          path: |
            dist/release/*.zip
            dist/release/*.sha256
          if-no-files-found: error
      - name: Save platform verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.platform }}
          path: |
            ${{ env.INSTALL_ROOT }}/install-report.json
            ${{ env.INSTALL_ROOT }}/install-report.mp4
          if-no-files-found: warn
  draft:
    name: Prepare downloadable release draft
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: openedit-*
          merge-multiple: true
          path: release-assets
      - name: Create or update verified draft (publication remains manual)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if gh release view "v$version" --json isDraft > /tmp/release.json 2>/dev/null; then
            python -c "import json; assert json.load(open('/tmp/release.json'))['isDraft'], 'Already published: bump the package version before another release'"
          else
            gh release create "v$version" --draft --target "$GITHUB_SHA" --title "OpenEdit $version" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release edit "v$version" --target "$GITHUB_SHA" --title "OpenEdit $version" --notes-file docs/RELEASE_NOTES.md
          gh release upload "v$version" release-assets/* --clobber
          gh release view "v$version" --json url
