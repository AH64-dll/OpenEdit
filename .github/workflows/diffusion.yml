name: Diffusion acceptance

on:
  push:
    branches: ["feat/**"]
  pull_request:

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -e ".[dev]"
      - run: python -m open_edit.integrations.diffusion.setup
      - run: pytest tests/test_diffusion_authoring.py tests/test_diffusion_authoring_api.py tests/test_migrations.py --timeout=40 --timeout-method=thread
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: python -m open_edit.integrations.diffusion.setup
      - run: npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
      - run: npx --prefix tests/browser playwright-core install --with-deps chromium
      - run: node tests/browser/authoring.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authoring-browser-captures
          path: tests/browser/artifacts/
