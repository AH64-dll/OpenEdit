name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HYPERFRAMES_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -U pip
          pip install -e ".[dev,serve,openai]" build
      - name: Lint
        run: ruff check open_edit tests
      - name: Python and frontend regression tests
        run: pytest -m "not browser" --timeout=30 --timeout-method=thread --tb=short
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Build distribution artifacts
        run: python -m build
      - name: Default install and MCP smoke check
        run: |
          python -m venv /tmp/openedit-smoke
          /tmp/openedit-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/openedit-smoke/bin/open-edit-mcp --help
          /tmp/openedit-smoke/bin/python -c "from open_edit.mcp.skills import load_skill; assert load_skill('open-edit-mcp')"
