name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HYPERFRAMES_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -U pip
          pip install -e ".[dev,serve,openai]" build
      - name: Install optional authoring compiler
        run: python -m open_edit.integrations.diffusion.setup
      - name: Lint
        run: ruff check open_edit tests
      - name: Python and frontend regression tests
        run: pytest -m "not browser" --timeout=30 --timeout-method=thread --tb=short
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Build distribution artifacts
        run: python -m build
      - name: Default install and MCP smoke check
        run: |
          python -m venv /tmp/openedit-smoke
          /tmp/openedit-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/openedit-smoke/bin/open-edit-mcp --help
          /tmp/openedit-smoke/bin/python -c "import cv2; from open_edit.kernel.tracking_jobs import _process_alive; import os; assert cv2.TrackerCSRT_create(); assert _process_alive(os.getpid())"
          /tmp/openedit-smoke/bin/python -c "from open_edit.mcp.skills import load_skill; assert load_skill('open-edit-mcp')"
          /tmp/openedit-smoke/bin/python -c "from open_edit.integrations.diffusion.compiler import worker_directory, worker_ready; assert (worker_directory() / 'vendor' / 'LICENSE').is_file(); assert not worker_ready()"
          /tmp/openedit-smoke/bin/python -c "from open_edit.integrations.diffusion.graphics import browser_directory, graphics_ready; root = browser_directory(); assert all((root / p).is_file() for p in ('vendor/PROVENANCE.json', 'fonts/OpenEditSans.woff2', 'fonts/OFL.txt', 'patches/koota+0.6.6.patch', 'package-lock.json')); assert not graphics_ready()"
          /tmp/openedit-smoke/bin/python -m open_edit.integrations.diffusion.setup --graphics
          /tmp/openedit-smoke/bin/python -c 'from open_edit.integrations.diffusion.compiler import parse_and_compile; result = parse_and_compile("export default function Project() { return <stage id=\"openedit\"><scene id=\"main\" width={1920} height={1080} active /></stage>; }"); assert result["document"]["tracks"] == []'
          /tmp/openedit-smoke/bin/python -c 'from open_edit.integrations.diffusion.graphics import DEFAULT_SOURCE, inspect_source; assert inspect_source(DEFAULT_SOURCE)["scene"]["width"] == 960'
