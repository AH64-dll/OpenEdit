[project]
name = "open_edit"
version = "1.3.0"
description = "AI-native video editor — IR, MCP server, render (melt/ffmpeg/Remotion)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "anthropic>=0.39",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
]
openai = ["openai>=1.30"]
whisper = [
    "faster-whisper>=1.0.0",
]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "anthropic>=0.39",
    "python-multipart>=0.0.9",
]
mcp = [
    "mcp>=1.0,<2",
]

[project.scripts]
open_edit = "open_edit.cli:main"
open-edit-mcp = "open_edit.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_edit"]

# Ship harness skill markdown with the wheel (not Cursor-only).
[tool.hatch.build.targets.wheel.force-include]
"open_edit/harness_skills/README.md" = "open_edit/harness_skills/README.md"
"open_edit/harness_skills/open-edit-mcp.md" = "open_edit/harness_skills/open-edit-mcp.md"
"open_edit/harness_skills/open-edit-mcp-reference.md" = "open_edit/harness_skills/open-edit-mcp-reference.md"
"open_edit/harness_skills/tool_surface.md" = "open_edit/harness_skills/tool_surface.md"
"open_edit/harness_skills/edit-planning.md" = "open_edit/harness_skills/edit-planning.md"
"open_edit/harness_skills/remotion_motion.md" = "open_edit/harness_skills/remotion_motion.md"
"open_edit/harness_skills/qc-standards.md" = "open_edit/harness_skills/qc-standards.md"
"open_edit/harness_skills/freeform_and_effects.md" = "open_edit/harness_skills/freeform_and_effects.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["build/", "dist/"]
